interface:
  display_name: "PTOAS Usability Eval"
  short_description: "按 30 个触点评估 PTOAS 易用性"
  default_prompt: >-
    Use $ptoas-usability-eval to evaluate this PTOAS repo by the 30 touch
    points from the PTOAS usability scorecard, classify the result by
    environment layer first, and output touchpoint-first findings.
