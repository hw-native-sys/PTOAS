name: A3 Nightly Board

# A3 full board validation on the GitCode runner pool.
#
# This is the A3 counterpart of the A5 nightly: it runs the whole board
# manifest (PTOAS_BOARD_ST_PART=0), not the two-case pre-smoke subset. The
# driver is the existing `pre_smoke.sh`, which builds, generates the payload,
# and then runs `run_remote_npu_validation.sh` against the full manifest.
#
# The runner is selected by label: the engineering group assigns the A3 board
# slot as `smoke=301`. Match the A5 slot's `npu=4`: `npu=1` found no runner, and
# the labels are AND-matched, so every requested label must exist on the host.
#
# A full sweep occupies the single A3 slot for hours. Serialize runs the same
# way the PyPTO smoke does, so two `/a3-nightly` comments or a comment plus the
# 01:00 schedule cannot pile onto the same board.
concurrency:
  max: 1
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  schedule:
    # GitCode evaluates cron in UTC+8, not UTC. This is 01:00 Asia/Shanghai,
    # offset from the A5 nightly (00:00) so the two board sweeps do not compete
    # for the same runner queue.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      device:
        description: "A3 NPU id; 'auto' lets the driver use its default logical device (0)"
        type: string
        default: "auto"
      run_only_cases:
        description: "Comma/space separated testcase names to run (empty = all A3 cases)"
        type: string
        default: ""
  # Trigger an early full sweep from a PR comment: `/a3-nightly`. This runs the
  # same job as the 01:00 schedule, so use it when the preflight needs to be
  # validated before the next night.
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?a3-nightly' ]

env:
  # The driver derives every artifact from WORKSPACE; keep the checkout and the
  # generated payload on one large filesystem.
  SOC_VERSION: Ascend910
  ASCEND_3RD_LIB_PATH: /home/opensource
  A3_BOARD_OBS_UPLOAD: ${{ vars.A3_BOARD_OBS_UPLOAD }}

jobs:
  a3-board:
    permissions:
      repository: read
      id-token: write
    name: A3 nightly board validation
    runs-on: ['self-hosted', 'npu=4', 'smoke=301']
    timeout-minutes: 600

    steps:
      - name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.sha }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Show board environment
        run: |
          set -euo pipefail
          echo "local time: $(date +'%F %T %Z')"
          echo "utc time:   $(date -u +'%F %T UTC')"
          uname -a
          nproc
          free -g || true
          # The full build and payload land in the checkout workspace; fail
          # before a multi-hour build instead of after the disk fills.
          workspace="${{ steps.process_checkout.outputs.path }}"
          [[ -n "${workspace}" ]] || workspace="${PWD}"
          # stat -f prints the remaining blocks and block size as plain
          # numbers, independent of the df formatting that varied between the
          # A3 pods. Keep stderr visible so a failure can be diagnosed.
          if ! command -v stat >/dev/null 2>&1; then
            echo "ERROR: stat is missing; cannot determine free space for ${workspace}" >&2
            exit 1
          fi
          if stat_output="$(stat -f -c '%a %S' "${workspace}" 2>&1)"; then
            read -r avail_blocks block_size <<< "${stat_output}"
            if [[ ! "${avail_blocks}" =~ ^[0-9]+$ || ! "${block_size}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: unexpected stat -f output for ${workspace}: ${stat_output}" >&2
              exit 1
            fi
            free_kb=$(( avail_blocks * block_size / 1024 ))
          else
            echo "ERROR: stat -f failed for ${workspace}: ${stat_output}" >&2
            exit 1
          fi
          if (( free_kb < 31457280 )); then
            echo "ERROR: ${workspace} has less than 30 GiB free; the full build and payload will not fit" >&2
            exit 1
          fi
          npu-smi info | head -40 || true
          # Fail fast on an incomplete deployment instead of after a long build.
          command -v npu-smi >/dev/null || { echo "ERROR: npu-smi is missing" >&2; exit 1; }
          compgen -G "/dev/davinci[0-9]*" >/dev/null || { echo "ERROR: no /dev/davinciN device node" >&2; exit 1; }
          for command in bash cmake git make python3 tar; do
            command -v "${command}" >/dev/null || { echo "ERROR: required command is missing: ${command}" >&2; exit 1; }
          done
          # The nightly driver (pre_smoke.sh -> run_remote_npu_validation.sh)
          # selects DEVICE_ID directly. task-submit belongs to the PyPTO
          # smoke's stage=full path, which is a separate workflow.
          if ! command -v task-submit >/dev/null 2>&1; then
            echo "WARNING: task-submit is not on PATH; the nightly driver does not use it." >&2
          fi

      - name: Run A3 board validation
        timeout-minutes: 540
        env:
          # The board driver skips the full sweep when this is unset/1; 0 makes
          # run_remote_npu_validation.sh enumerate and run the whole manifest.
          PTOAS_BOARD_ST_PART: "0"
          PTOAS_BOARD_RUN_ONLY: ${{ inputs.run_only_cases }}
          INPUT_DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          workspace="${{ steps.process_checkout.outputs.path }}"
          [[ -n "${workspace}" ]] || workspace="${PWD}"
          export WORKSPACE="${workspace}"
          # run_remote_npu_validation.sh treats an empty DEVICE_ID as "auto"
          # and rejects a non-empty non-integer value, so normalize the
          # workflow's "auto" spelling before handing it over.
          DEVICE_ID="${INPUT_DEVICE:-}"
          if [[ "${DEVICE_ID}" == "auto" ]]; then
            DEVICE_ID=""
          fi
          export DEVICE_ID
          # The driver applies its own fixed skip list (mix_kernel, the two
          # vadd_validshape cases and print); an extra skip input is deliberately
          # not exposed until the driver accepts one.
          export RUN_ONLY_CASES="${PTOAS_BOARD_RUN_ONLY:-}"

          # The driver writes ./run_test.log relative to its cwd; pin cwd to the
          # checkout so the log and the payload both land under WORKSPACE.
          cd "${workspace}"
          log_dir="${workspace}/build/a3-nightly"
          mkdir -p "${log_dir}"
          bash "${workspace}/.gitcode/scripts/pre_smoke.sh" 2>&1 | tee "${log_dir}/a3-nightly.log"

          if ! grep -q "DEVICE_ID=" "${workspace}/run_test.log"; then
            echo "ERROR: board validation never started; refusing to report success" >&2
            exit 1
          fi
          if ! grep -q "MATCHED=" "${workspace}/run_test.log"; then
            echo "ERROR: board validation produced no case summary; refusing to report success" >&2
            exit 1
          fi

      # The validation step alone may run 540 minutes, longer than the 3600s
      # OIDC credential, so exchange it right before the upload.
      - name: oidc_auth
        if: ${{ always() && env.A3_BOARD_OBS_UPLOAD == 'true' }}
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600

      - name: Upload board logs
        if: ${{ always() && env.A3_BOARD_OBS_UPLOAD == 'true' }}
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/run_test.log
            ${{ steps.process_checkout.outputs.path }}/build/a3-nightly/a3-nightly.log
            ${{ steps.process_checkout.outputs.path }}/build/ptoas-samples/expected_npu_validation_cases.txt
          object-prefix: pto-as/a3-nightly-board/${{ atomgit.workflow_run_id }}/
