name: PR-pipeline_cann_pto-as

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}
  CANN_HOME: ${{ vars.CANN_HOME || '/home/jenkins/Ascend/cann' }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
          -
            name: show_output
            run: |
              echo "Compile_Ascend_X86: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_x86_compile:
        name: Compile_x86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          package_name: 'cann-pto-as_linux-x86_64.run'
      JOB_arm_compile:
        name: Compile_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
          arch: 'arm64'
          package_name: 'cann-pto-as_linux-aarch64.run'
      JOB_build_and_test:
        name: Build_and_test
        needs: []
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{ secrets.GIT_TOKEN }}
          - name: Build and test PTOAS
            timeout-minutes: 180
            uses: build-accelerate
            with:
              command: |
                set -euo pipefail
                export WORKSPACE="${{ steps.process_checkout.outputs.path }}"
                cd "${WORKSPACE}"
                export CMAKE_C_COMPILER_LAUNCHER=/tmp/codearts/cloudcache/xcache
                export CMAKE_CXX_COMPILER_LAUNCHER=/tmp/codearts/cloudcache/xcache
                BuildAccelerate bash .gitcode/scripts/build_and_test.sh "${WORKSPACE}"
              AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
        runs-on:
          - self-hosted
          - arch=x64
          - spec=xlarge
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_sim_validation:
        name: SIM_VALIDATION
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{ secrets.GIT_TOKEN }}
              allow-unsafe-pr-checkout: true
          - name: Prepare simulator environment
            timeout-minutes: 300
            run: |
              set -euo pipefail
              # The runner declares its own environment (the systemd unit of the
              # runner service, or its .env): this workflow spells out no host path
              # and invents no default. Read values with printenv - the platform
              # rewrites brace syntax inside run blocks, and a bare test would trip
              # over set -u. See .gitcode/scripts/setup_sim_runner.sh.
              #
              # The gate is in its observation phase (see the observation block in
              # .gitcode/scripts/sim_validation.sh), so a gap in the runner environment
              # warns and skips this step instead of failing: while the setup is
              # still being proven on real pull requests, it must not fail somebody
              # else's merge request. Restore the hard failure together with the
              # observation block once the gate starts enforcing.
              require_env() {
                if [ -z "$2" ]; then
                  echo "ERROR: this runner must provide $1 (runner service environment)" >&2
                  echo "::warning::SIM_VALIDATION observation phase: skipping this step without $1" >&2
                  exit 0
                fi
              }
              require_env SIM_PYTHON_BIN "$(printenv SIM_PYTHON_BIN || true)"
              require_env ASCEND_3RD_LIB_PATH "$(printenv ASCEND_3RD_LIB_PATH || true)"
              echo "python: $(printenv SIM_PYTHON_BIN)"
              echo "llvm cache: $(printenv ASCEND_3RD_LIB_PATH)"
              echo "pto-isa source: $(printenv PTO_ISA_SOURCE_DIR || echo clone-from-url)"
              echo "pypto source: $(printenv PYPTO_SOURCE_DIR || echo clone-from-url)"
              # Bisheng parses host side with this contract; derive it from the
              # active gcc only when the environment did not provide one.
              bisheng_flags="$(printenv BISHENG_FLAGS || true)"
              if [ -z "$bisheng_flags" ] && command -v gcc >/dev/null 2>&1; then
                gcc_install_dir="$(gcc -print-search-dirs | sed -n "s/^install: //p")"
                gcc_toolchain="$(printf "%s" "$gcc_install_dir" | sed "s|/lib/gcc/.*||")"
                if [ -n "$gcc_toolchain" ] && [ -d "$gcc_toolchain" ]; then
                  export BISHENG_FLAGS="--gcc-toolchain=$gcc_toolchain"
                fi
              fi
              bash "${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/sim_validation.sh" build \
                "${{ steps.process_checkout.outputs.path }}"
          - name: Run VPTO simulator validation
            timeout-minutes: 300
            run: |
              set -euo pipefail
              export SIM_SUITE=vpto
              bash "${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/sim_validation.sh" test \
                "${{ steps.process_checkout.outputs.path }}"
          - name: Run TileLang ST validation
            if: always()
            timeout-minutes: 300
            run: |
              set -euo pipefail
              export SIM_SUITE=tilelib
              bash "${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/sim_validation.sh" test \
                "${{ steps.process_checkout.outputs.path }}"
          - name: Run PTODSL ST validation
            if: always()
            timeout-minutes: 300
            run: |
              set -euo pipefail
              export SIM_SUITE=ptodsl
              bash "${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/sim_validation.sh" test \
                "${{ steps.process_checkout.outputs.path }}"
          - name: Run PyPTO simulator validation
            if: always()
            timeout-minutes: 300
            run: |
              set -euo pipefail
              export SIM_SUITE=pypto
              bash "${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/sim_validation.sh" test \
                "${{ steps.process_checkout.outputs.path }}"
          - name: Upload simulator logs
            if: always()
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/vpto-sim.log
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/tilelib-st.log
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/ptodsl-dsl-st.log
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/pypto-*.log
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/cases/parallel-runner.log
                ${{ steps.process_checkout.outputs.path }}/.work/gitcode-vpto-sim/cases/parallel-summary.tsv
              object-prefix: ${{ env.obs_path }}/sim/
        runs-on: ["self-hosted", "runner=label_1"]
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: PreSmoke
    jobs:
      PreSmoke_A2:
        name: PreSmoke_A2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download pr files
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
                set -e
                # set env
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                export download_path=${{ steps.process_download.outputs.download-path }}
                export package_name=${{jobs.Compile_Ascend_ARM_ubuntu24.outputs.package_name}}
                export obs_path=${{env.obs_path}}
                export repo_name=${{env.repo_name}}
                export obs_smoke_path=${{ env.obs_smoke_path }}
                export pr_id=${{ env.MERGE_ID }}
                export AK=${{secrets.AK}}
                export SK=${{secrets.SK}}
                export ST_PART=1
                bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','npu=1','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_A900 }}
    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
