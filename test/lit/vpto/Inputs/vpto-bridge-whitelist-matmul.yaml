# VPTO C++ interface bridge whitelist for the MATMUL family lit tests. The
# entries lower through the declarative channel: each abi row binds a
# wrapper argument to an IR operand position (positional, with the ODS
# operand name as the diagnostic label) and a template role; the role set
# also names the tile typedefs the generic renderer emits. The attr row
# maps the accPhase enum attribute, omitting the Unspecified case (and
# entries whose IR op carries no phase at all); its spec token feeds the
# tmpl_args slot. Variant entries share the role-named typedefs; duplicates
# deduplicate at render time. Entry names default from the op name.
wrappers:
  - name: matmul
    includes: [pto/npu/a5/TMatmul.hpp]
    core: cube
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    call: pto::TMATMUL
    tmpl_args: [acc_phase]
    abi:
      - {operand: 2, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: rhs, role: right_tile}
    tmpl_map:
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.acc
    wrapper: matmul
    call: pto::TMATMUL_ACC
    tmpl_args: [acc_phase]
    abi:
      - {operand: 3, arg: dst, role: result_tile}
      - {operand: 0, arg: accIn, role: acc_in_tile}
      - {operand: 1, arg: lhs, role: left_tile}
      - {operand: 2, arg: rhs, role: right_tile}
    tmpl_map:
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.bias
    wrapper: matmul
    call: pto::TMATMUL_BIAS
    tmpl_args: [acc_phase]
    abi:
      - {operand: 3, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: rhs, role: right_tile}
      - {operand: 2, arg: bias, role: bias_tile}
    tmpl_map:
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx
    wrapper: matmul
    call: pto::TMATMUL_MX
    tmpl_args: [acc_phase]
    abi:
      - {operand: 4, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: aScale, role: a_scale_tile}
      - {operand: 2, arg: rhs, role: right_tile}
      - {operand: 3, arg: bScale, role: b_scale_tile}
    tmpl_map:
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx.acc
    wrapper: matmul
    call: pto::TMATMUL_MX
    tmpl_args: [acc_phase]
    abi:
      - {operand: 5, arg: dst, role: result_tile}
      - {operand: 0, arg: accIn, role: acc_in_tile}
      - {operand: 1, arg: lhs, role: left_tile}
      - {operand: 2, arg: aScale, role: a_scale_tile}
      - {operand: 3, arg: rhs, role: right_tile}
      - {operand: 4, arg: bScale, role: b_scale_tile}
    tmpl_map:
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx.bias
    wrapper: matmul
    call: pto::TMATMUL_MX
    abi:
      - {operand: 5, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: aScale, role: a_scale_tile}
      - {operand: 2, arg: rhs, role: right_tile}
      - {operand: 3, arg: bScale, role: b_scale_tile}
      - {operand: 4, arg: bias, role: bias_tile}
