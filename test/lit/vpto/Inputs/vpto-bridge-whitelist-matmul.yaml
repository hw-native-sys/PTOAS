# VPTO C++ interface bridge whitelist for the MATMUL family lit tests. The
# entries lower through the declarative channel: each abi row binds a
# wrapper argument to an IR operand position (positional, with the ODS
# operand name as the diagnostic label) and a template role; the tile types
# are spread over the matmul operand roles, so the tmpl_map rows use the
# per-role sources. The attr row maps the accPhase enum attribute, omitting
# the Unspecified case (and entries whose IR op carries no phase at all).
# Variant entries declare the full role-tile set they render; duplicate
# typedef targets deduplicate at render time.
bridge_ops:
  - op: pto.tmatmul
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul
    abi:
      - {operand: 2, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: lhs, type: i64, role: left_tile}
      - {operand: 1, arg: rhs, type: i64, role: right_tile}
    tmpl_map:
      - source: left_tile
        field: tile
        target: LeftTile
      - source: right_tile
        field: tile
        target: RightTile
      - source: result_tile
        field: tile
        target: ResultTile
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.acc
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul_acc
    abi:
      - {operand: 3, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: acc_in, type: i64, role: acc_in_tile}
      - {operand: 1, arg: lhs, type: i64, role: left_tile}
      - {operand: 2, arg: rhs, type: i64, role: right_tile}
    tmpl_map:
      - source: acc_in_tile
        field: tile
        target: AccInTile
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.bias
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul_bias
    abi:
      - {operand: 3, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: a, type: i64, role: left_tile}
      - {operand: 1, arg: b, type: i64, role: right_tile}
      - {operand: 2, arg: bias, type: i64, role: bias_tile}
    tmpl_map:
      - source: left_tile
        field: tile
        target: LeftTile
      - source: right_tile
        field: tile
        target: RightTile
      - source: result_tile
        field: tile
        target: ResultTile
      - source: bias_tile
        field: tile
        target: BiasTile
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul_mx
    abi:
      - {operand: 4, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: a, type: i64, role: left_tile}
      - {operand: 1, arg: a_scale, type: i64, role: a_scale_tile}
      - {operand: 2, arg: b, type: i64, role: right_tile}
      - {operand: 3, arg: b_scale, type: i64, role: b_scale_tile}
    tmpl_map:
      - source: left_tile
        field: tile
        target: LeftTile
      - source: right_tile
        field: tile
        target: RightTile
      - source: result_tile
        field: tile
        target: ResultTile
      - source: a_scale_tile
        field: tile
        target: AScaleTile
      - source: b_scale_tile
        field: tile
        target: BScaleTile
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx.acc
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul_mx_acc
    abi:
      - {operand: 5, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: c_in, type: i64, role: acc_in_tile}
      - {operand: 1, arg: a, type: i64, role: left_tile}
      - {operand: 2, arg: a_scale, type: i64, role: a_scale_tile}
      - {operand: 3, arg: b, type: i64, role: right_tile}
      - {operand: 4, arg: b_scale, type: i64, role: b_scale_tile}
    tmpl_map:
      - source: left_tile
        field: tile
        target: LeftTile
      - source: right_tile
        field: tile
        target: RightTile
      - source: result_tile
        field: tile
        target: ResultTile
      - source: acc_in_tile
        field: tile
        target: AccInTile
      - source: a_scale_tile
        field: tile
        target: AScaleTile
      - source: b_scale_tile
        field: tile
        target: BScaleTile
      - source: attr
        field: acc_phase
        target: AccPhase
        enum_type: pto::AccPhase
        omit_value: Unspecified
  - op: pto.tmatmul.mx.bias
    family: matmul
    lowering: declarative
    entry: pto_vpto_matmul_mx_bias
    abi:
      - {operand: 5, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: a, type: i64, role: left_tile}
      - {operand: 1, arg: a_scale, type: i64, role: a_scale_tile}
      - {operand: 2, arg: b, type: i64, role: right_tile}
      - {operand: 3, arg: b_scale, type: i64, role: b_scale_tile}
      - {operand: 4, arg: bias, type: i64, role: bias_tile}
    tmpl_map:
      - source: left_tile
        field: tile
        target: LeftTile
      - source: right_tile
        field: tile
        target: RightTile
      - source: result_tile
        field: tile
        target: ResultTile
      - source: a_scale_tile
        field: tile
        target: AScaleTile
      - source: b_scale_tile
        field: tile
        target: BScaleTile
      - source: bias_tile
        field: tile
        target: BiasTile
