# Diagnostic fixture: a declarative entry without the mandatory call
# spelling. The generic renderer cannot emit the entry body without it, so
# the whitelist validator rejects the document at parse time.
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    abi:
      - {operand: 2, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: rhs, role: right_tile}
