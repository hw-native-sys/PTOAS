# Diagnostic fixture: a tmpl_args item that is neither a qualified literal
# nor an attr tmpl_map field of the entry. The renderer would have no spec
# token to feed the slot with, so the whitelist validator rejects the
# document at parse time instead of silently dropping the template list.
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    call: pto::TMATMUL
    tmpl_args: [phase]
    abi:
      - {operand: 2, arg: dst, role: result_tile}
      - {operand: 0, arg: lhs, role: left_tile}
      - {operand: 1, arg: rhs, role: right_tile}
