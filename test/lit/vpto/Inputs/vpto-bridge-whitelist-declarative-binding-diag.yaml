# Diagnostic whitelist exercising the declarative binding failures: an
# out-of-range operand index, a non-tile_buf operand, a result-bearing op
# routed to the buffer-form channel, and a non-enum attribute feeding an
# attr tmpl_map row. Each entry is matched by exactly one op in the test
# module so the diagnostics stay unambiguous.
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    entry: pto_vpto_matmul_oob
    abi:
      - {operand: 7, arg: dst, type: i64, role: result_tile}
  - op: pto.tpush
    wrapper: pipe
    entry: pto_vpto_pipe_push_bad
    abi:
      - {operand: 1, arg: pipe_handle, type: i64, role: pipe_slot}
  - op: pto.tile_buf_addr
    wrapper: matmul
    entry: pto_vpto_tile_buf_addr
    abi:
      - {operand: 0, arg: tile, type: i64, role: result_tile}
  - op: pto.tmatmul.bias
    wrapper: matmul
    entry: pto_vpto_matmul_bias_bad_attr
    abi:
      - {operand: 3, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: a, type: i64, role: left_tile}
      - {operand: 1, arg: b, type: i64, role: right_tile}
      - {operand: 2, arg: bias, type: i64, role: bias_tile}
    tmpl_map:
      - source: attr
        field: some_flag
        target: SomeFlag
        enum_type: pto::AccPhase
        omit_value: Unspecified
