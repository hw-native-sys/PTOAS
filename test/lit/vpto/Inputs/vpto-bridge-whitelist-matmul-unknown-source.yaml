# Diagnostic fixture: a declarative tmpl_map row whose source is not one of
# the entry's abi roles must be rejected by the whitelist validator (the
# role set replaced the old hardcoded matmul source set).
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    entry: pto_vpto_matmul
    abi:
      - {operand: 2, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: lhs, type: i64, role: left_tile}
      - {operand: 1, arg: rhs, type: i64, role: right_tile}
    tmpl_map:
      - source: pipe.init
        field: tile
        target: LeftTile
