# Diagnostic fixture: a declarative tmpl_map row whose source is not the
# 'attr' enum mapping must be rejected by the whitelist validator. Tile
# typedefs derive from the abi roles under the role-driven renderer, so a
# tile-sourced row is the legacy spelling and names a target the renderer
# never emits.
bridge_ops:
  - op: pto.tmatmul
    wrapper: matmul
    entry: pto_vpto_matmul
    call: pto::TMATMUL
    abi:
      - {operand: 2, arg: dst, type: i64, role: result_tile}
      - {operand: 0, arg: lhs, type: i64, role: left_tile}
      - {operand: 1, arg: rhs, type: i64, role: right_tile}
    tmpl_map:
      - source: pipe.init
        field: tile
        target: LeftTile
