# Variant VPTO pipe bridge whitelist with declarative tmpl_map rows, used by
# the Phase 2 bridge spec/wrapper generation lit tests. The tmpl_map rows are
# declarative IR-field -> C++-template-slot mappings validated at parse time;
# the token construction itself lives in VPTOBridgeTokens. See
# docs/designs/vpto-cpp-bridge-generalization.md.
bridge_ops:
  - op: pto.initialize_l2l_pipe
    family: pipe
    entry: pto_vpto_pipe_init
    storage_size_entry: pto_vpto_pipe_size
    abi:
      - type: ptr    # storage, synthesized by the bridge lowering
      - type: i32    # consumer local buffer address
    tmpl_map:
      - source: pipe.init
        field: slot_size
        target: TPipe::slotSize
      - source: pipe.init
        field: slot_num
        target: TPipe::slotNum
      - source: tile
        field: rows
        target: Tile::Rows
  - op: pto.tpush
    family: pipe
    entry: pto_vpto_pipe_push
    abi:
      - type: ptr    # storage
      - type: i64    # producer tile address
  - op: pto.tpop
    family: pipe
    entry: pto_vpto_pipe_pop
    abi:
      - type: ptr    # storage
  - op: pto.tfree
    family: pipe
    entry: pto_vpto_pipe_free
    abi:
      - type: ptr    # storage
  - op: internal    # wrapper-internal helper, not routed from an IR op
    family: pipe
    entry: pto_vpto_pipe_size
    abi: []
