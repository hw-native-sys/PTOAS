[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-costmodel"
version = "2.0.0.dev1"
description = "Native-dependency-free PTOAS cost model exchange contracts"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["pto_costmodel"]
package-dir = {pto_costmodel = "."}

[tool.setuptools.package-data]
pto_costmodel = ["*.json"]
