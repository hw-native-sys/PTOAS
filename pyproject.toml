# Standard PEP 517 configuration for the `ptoas` distribution. Set
# LLVM_BUILD_DIR to an existing LLVM/MLIR build. Pass
# `--config-settings=build-dir=<path>` when tests or development tools require
# a persistent CMake build tree.

[build-system]
requires = ["scikit-build-core>=0.12.2,<2", "pybind11<3"]
build-backend = "scikit_build_core.build"

[project]
name = "ptoas"
dynamic = ["version"]
description = "PTO Assembler & Optimizer"
readme = "README.md"
requires-python = ">=3.7"
license = "Apache-2.0"
dependencies = [
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ptoas = "ptoas._cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = "CMakeLists.txt"
ninja.version = ">=1.10"
build.verbose = false
editable.mode = "redirect"
install.components = ["PTOAS_Python"]

[tool.scikit-build.wheel.packages]
ptodsl = "ptodsl/ptodsl"
ptoas = "ptodsl/ptoas"
TileOps = "lib/TileOps"
SoftOps = "lib/SoftOps"

[tool.scikit-build.cmake.define]
PTOAS_RELEASE_VERSION_OVERRIDE = { env = "PTOAS_RELEASE_VERSION_OVERRIDE", default = "" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\s*\(\s*ptoas\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+)\s*\)'
