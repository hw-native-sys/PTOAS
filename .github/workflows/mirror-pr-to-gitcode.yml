name: Mirror PR to GitCode

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: GitHub PR number to mirror
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitcode-mirror-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITCODE_API: https://gitcode.com/api/v5
  GITCODE_UPSTREAM: cann/pto-as
  GITCODE_FORK: lllzzzddd/pto-as
  GITCODE_TARGET_BRANCH: master
  GITCODE_SOURCE_PREFIX: mirror/github-pr-

jobs:
  mirror:
    runs-on: ubuntu-22.04
    steps:
      - name: Read pull request metadata
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number." >&2
            exit 1
          fi

          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          base_ref="$(jq -r '.base.ref' <<< "$metadata")"
          head_sha="$(jq -r '.head.sha' <<< "$metadata")"
          author_login="$(jq -r '.user.login' <<< "$metadata")"
          author_id="$(jq -r '.user.id' <<< "$metadata")"
          source_repo="$(jq -r '.head.repo.full_name // empty' <<< "$metadata")"

          if [[ "$base_ref" != "main" || ! "$head_sha" =~ ^[0-9a-f]{40}$ ||
                ! "$author_login" =~ ^[A-Za-z0-9-]+$ || ! "$author_id" =~ ^[0-9]+$ ]]; then
            echo "Unsupported pull request metadata." >&2
            exit 1
          fi
          if [[ -z "$source_repo" || ! "$source_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "The pull request has no valid source repository." >&2
            exit 1
          fi

          {
            echo "PR_NUMBER=$pr_number"
            echo "GITHUB_BASE_REF=$base_ref"
            echo "GITHUB_HEAD_SHA=$head_sha"
            echo "PR_AUTHOR_LOGIN=$author_login"
            echo "PR_AUTHOR_ID=$author_id"
            echo "GITHUB_SOURCE_REPOSITORY=$source_repo"
            echo "MIRROR_BRANCH=${GITCODE_SOURCE_PREFIX}${pr_number}"
          } >> "$GITHUB_ENV"

      - name: Generate pull request patch
        env:
        shell: bash
        run: |
          set -euo pipefail

          github_dir="${RUNNER_TEMP}/github"
          mkdir -p "$github_dir"
          git -C "$github_dir" init -q
          git -C "$github_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$github_dir" fetch --no-tags --filter=blob:none origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

          actual_head="$(git -C "$github_dir" rev-parse refs/remotes/origin/pr-head)"
          if [[ "$actual_head" != "$GITHUB_HEAD_SHA" ]]; then
            echo "The pull request changed while it was being read." >&2
            exit 1
          fi

          merge_base="$(git -C "$github_dir" merge-base \
            refs/remotes/origin/base refs/remotes/origin/pr-head)"
          git -C "$github_dir" -c diff.renames=false diff \
            --no-ext-diff --no-textconv --binary --full-index \
            "$merge_base" refs/remotes/origin/pr-head > "${RUNNER_TEMP}/github-pr.patch"

      - name: Configure GitCode SSH
        env:
          GITCODE_SSH_KEY: ${{ secrets.GITCODE_MIRROR_SSH_KEY }}
          GITCODE_KNOWN_HOSTS: ${{ secrets.GITCODE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITCODE_SSH_KEY" || -z "$GITCODE_KNOWN_HOSTS" ]]; then
            echo "GitCode SSH secrets are not configured." >&2
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITCODE_SSH_KEY" > "$HOME/.ssh/gitcode_mirror"
          printf '%s\n' "$GITCODE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gitcode_mirror" "$HOME/.ssh/known_hosts"
          {
            echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/gitcode_mirror -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Update GitCode fork branch
        env:
          GIT_AUTHOR_NAME: lllzzzddd
          GIT_AUTHOR_EMAIL: liuzidi1@huawei.com
          GIT_COMMITTER_NAME: lllzzzddd
          GIT_COMMITTER_EMAIL: liuzidi1@huawei.com
        shell: bash
        run: |
          set -euo pipefail

          gitcode_dir="${RUNNER_TEMP}/gitcode"
          git clone -q --single-branch --branch "$GITCODE_TARGET_BRANCH" \
            "git@gitcode.com:${GITCODE_FORK}.git" "$gitcode_dir"

          git -C "$gitcode_dir" checkout -q -B "$MIRROR_BRANCH" "origin/$GITCODE_TARGET_BRANCH"

          old_remote="$(git ls-remote origin "refs/heads/${MIRROR_BRANCH}" | cut -f1)"
          git -C "$gitcode_dir" apply --check --binary "${RUNNER_TEMP}/github-pr.patch"
          git -C "$gitcode_dir" apply --index --binary "${RUNNER_TEMP}/github-pr.patch"

          if ! git -C "$gitcode_dir" diff --cached --quiet; then
            git -C "$gitcode_dir" commit -q \
              -m "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)" \
              -m "Mirrored from https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" \
              -m "GitHub-Head: ${GITHUB_HEAD_SHA}"
          fi

          git -C "$gitcode_dir" push \
            --force-with-lease="refs/heads/${MIRROR_BRANCH}:${old_remote}" \
            origin "HEAD:refs/heads/${MIRROR_BRANCH}"

      - name: Create GitCode pull request if needed
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_MIRROR_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITCODE_TOKEN" ]]; then
            echo "GITCODE_MIRROR_TOKEN is not configured." >&2
            exit 1
          fi

          pulls_file="${RUNNER_TEMP}/gitcode-pulls.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GITCODE_TOKEN}" \
            -H 'Accept: application/json' \
            "${GITCODE_API}/repos/${GITCODE_UPSTREAM}/pulls?state=all&per_page=100" \
            > "$pulls_file"

          existing_url="$(jq -r --arg branch "$MIRROR_BRANCH" --arg fork "$GITCODE_FORK" \
            '.[] | select(.head.ref == $branch and .head.repo.full_name == $fork and .state == "open") | .html_url' \
            "$pulls_file" | head -n 1)"
          if [[ -n "$existing_url" ]]; then
            echo "GitCode pull request already exists: $existing_url"
            exit 0
          fi

          body="Mirrored from: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}\n\nGitHub head SHA: ${GITHUB_HEAD_SHA}\n\nThis branch is maintained from the GitHub PR and should not be edited directly."
          payload="$(jq -n \
            --arg title "[GitHub #${PR_NUMBER}] ${PR_TITLE:-GitHub pull request}" \
            --arg body "$body" \
            --arg head "${GITCODE_FORK%%/*}:${MIRROR_BRANCH}" \
            --arg base "$GITCODE_TARGET_BRANCH" \
            '{title: $title, body: $body, head: $head, base: $base}')"
          response="${RUNNER_TEMP}/gitcode-pr.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer ${GITCODE_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            "${GITCODE_API}/repos/${GITCODE_UPSTREAM}/pulls" \
            --data "$payload" > "$response"
          jq -r '"GitCode pull request: " + (.html_url // .web_url)' "$response"
