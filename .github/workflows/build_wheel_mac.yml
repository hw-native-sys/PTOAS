name: Build Wheel (macOS)

on:
  push:
    tags-ignore:
      - '**'
  # macOS wheels are intentionally not built on pull requests (expensive
  # macOS runners); nightly/release/manual runs still build and publish them.
  schedule:
    # Nightly build & publish (UTC time, offset from Linux workflow).
    - cron: "40 17 * * *"
  workflow_dispatch:
    inputs:
      release_kind:
        description: Manual release flavor for dry-runs
        type: choice
        options:
          - ptoas
          - vmi
        default: ptoas
  release:
    types: [prereleased, released]

permissions:
  contents: read

concurrency:
  # Linux and macOS publish to the same rolling release. The schedules are
  # offset by 30 minutes; this non-canceling group prevents asset upload races.
  # GitHub keeps at most one pending run in a group, so a run that spans the
  # next daily schedule may replace an older pending run by design. Manual
  # workflow_dispatch runs are dry-runs and do not publish the nightly release.
  group: ${{ github.event_name == 'schedule' && 'nightly-wheel-publish' || format('build-wheel-macos-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  LLVM_REPO: https://github.com/vpto-dev/llvm-project.git
  LLVM_REF: feature-vpto
  LLVM_CACHE_FLAVOR: llvm19-vpto-wheel-static-pic-utils-v3

jobs:
  build_wheel:
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'ptoas-v')
    # Non-release runs keep a single-Python matrix for faster gates;
    # release/nightly runs fan out to publish the full wheel set plus binary artifacts.
    name: Build ptoas wheel (macOS ${{ matrix.arch }}, py${{ matrix.python }})
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-26' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson((github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10","3.11","3.12"]' || '["3.11"]') }}
        arch: ["x86_64", "aarch64"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select runner metadata
        id: runner-meta
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "label=macos-15-intel" >> "$GITHUB_OUTPUT"
          else
            echo "label=macos-26" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set Python path
        run: |
          echo "PY_PATH=$(python -c 'import sys; print(sys.prefix)')" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          brew install ninja ccache

      - name: Install Python dependencies
        run: |
          # LLVM/MLIR Python bindings are not yet compatible with pybind11 3.x
          # (see pybind11 static_assert on def_property + keep_alive).
          pip install --no-cache-dir numpy 'pybind11<3' 'scikit-build-core>=0.12.2,<2' delocate

      - name: Resolve PTOAS distribution version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            case "${GITHUB_REF_NAME}" in
              vmi-v*)
                EXPECTED_RELEASE_VERSION="$(python packaging/ptoas-vmi/prepare_source.py --print-version)"
                PTOAS_VERSION="${GITHUB_REF_NAME#vmi-v}"
                PTOAS_CLI_VERSION="vmi ${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas-vmi"
                ;;
              ptoas-v*)
                EXPECTED_RELEASE_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
                PTOAS_VERSION="${GITHUB_REF_NAME#ptoas-v}"
                PTOAS_CLI_VERSION="${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas"
                ;;
              v*)
                EXPECTED_RELEASE_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
                PTOAS_VERSION="${GITHUB_REF_NAME#v}"
                PTOAS_CLI_VERSION="${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas"
                ;;
              *)
                echo "release tags for the wheel workflow must start with 'v', 'ptoas-v', or 'vmi-v'" >&2
                exit 1
                ;;
            esac
            if [ "${PTOAS_VERSION}" != "${EXPECTED_RELEASE_VERSION}" ]; then
              echo "release tag '${GITHUB_REF_NAME}' does not match project version '${EXPECTED_RELEASE_VERSION}'" >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.release_kind }}" = "vmi" ]; then
            PTOAS_VERSION="$(python packaging/ptoas-vmi/prepare_source.py --print-version)"
            PTOAS_CLI_VERSION="vmi ${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas-vmi"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PTOAS_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
            PTOAS_CLI_VERSION="${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas"
          else
            PTOAS_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode dev)"
            PTOAS_CLI_VERSION="${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas"
          fi
          echo "PTOAS_VERSION=${PTOAS_VERSION}" >> "$GITHUB_ENV"
          echo "PTOAS_CLI_VERSION=${PTOAS_CLI_VERSION}" >> "$GITHUB_ENV"
          echo "PTOAS_PYTHON_PACKAGE_NAME=${PTOAS_PYTHON_PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "Using PTOAS CLI version: ${PTOAS_CLI_VERSION}"
          echo "Using PTOAS wheel version: ${PTOAS_VERSION}"
          echo "Using PTOAS Python package name: ${PTOAS_PYTHON_PACKAGE_NAME}"

      - name: Validate PEP 517 project metadata
        run: |
          python -m scikit_build_core.build project-table

      - name: Set build directories
        run: |
          echo "WORKSPACE_DIR=${RUNNER_TEMP}/llvm-workspace" >> $GITHUB_ENV
          echo "LLVM_SOURCE_DIR=${RUNNER_TEMP}/llvm-workspace/llvm-project" >> $GITHUB_ENV
          echo "LLVM_BUILD_DIR=${RUNNER_TEMP}/llvm-workspace/llvm-project/build-wheel-static" >> $GITHUB_ENV
          echo "LLVM_INSTALL_DIR=${RUNNER_TEMP}/llvm-workspace/llvm-install" >> $GITHUB_ENV
          echo "PTO_SOURCE_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PTO_BUILD_DIR=$GITHUB_WORKSPACE/build-release" >> $GITHUB_ENV

      - name: Resolve LLVM source SHA
        id: llvm-source
        run: |
          LLVM_SOURCE_SHA="$(git ls-remote "${LLVM_REPO}" "refs/heads/${LLVM_REF}" | awk '{print $1}')"
          if [ -z "${LLVM_SOURCE_SHA}" ]; then
            echo "ERROR: failed to resolve ${LLVM_REPO} ${LLVM_REF}" >&2
            exit 1
          fi
          echo "sha=${LLVM_SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      # The cache holds the LLVM install prefix, not the build tree: it is
      # much smaller and is shared across Python versions (PTOAS assembles the
      # mlir Python package itself from MLIR's exported Python source-set, so
      # the Python used to configure LLVM does not affect wheel builds).
      - name: Restore LLVM build cache (exact key)
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm-workspace/llvm-install
          key: llvm-${{ steps.llvm-source.outputs.sha }}-${{ steps.runner-meta.outputs.label }}-${{ matrix.arch }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Prepare LLVM source
        run: |
          mkdir -p $LLVM_SOURCE_DIR
          cd $LLVM_SOURCE_DIR
          if [ ! -d .git ]; then
            git init
            git remote add origin "${LLVM_REPO}"
          fi
          git remote set-url origin "${LLVM_REPO}"
          git fetch --depth 1 origin "${{ steps.llvm-source.outputs.sha }}"
          git checkout --force "${{ steps.llvm-source.outputs.sha }}"

      - name: Build LLVM/MLIR
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          cd $LLVM_SOURCE_DIR
          cmake -G Ninja -S llvm -B $LLVM_BUILD_DIR \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DMLIR_LINK_MLIR_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=ON \
            -DMLIR_INSTALL_AGGREGATE_OBJECTS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE=$(which python) \
            -DPython_EXECUTABLE=$(which python) \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_INSTALL_PREFIX=$LLVM_INSTALL_DIR
          ninja -C $LLVM_BUILD_DIR
          cmake --install $LLVM_BUILD_DIR

      # Upload cache immediately after the build step to avoid later steps
      # polluting the install tree. Only the default branch saves, and only
      # from a single Python leg: branch pushes may restore the shared cache
      # but must not create private multi-GB entries that evict it, and
      # parallel Python legs must not race to save the same key.
      - name: Save LLVM cache
        if: >-
          steps.cache-llvm.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          matrix.python == '3.11' &&
          success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llvm-workspace/llvm-install
          key: llvm-${{ steps.llvm-source.outputs.sha }}-${{ steps.runner-meta.outputs.label }}-${{ matrix.arch }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Build PTOAS
        run: |
          # Keep Git usable in the build environment even when checkout ran
          # with a different HOME or outside the job container.
          git config --global --add safe.directory "${PTO_SOURCE_DIR}"
          git -C "${PTO_SOURCE_DIR}" rev-parse --verify 'HEAD^{commit}' >/dev/null
          if [ "${PTOAS_PYTHON_PACKAGE_NAME}" = "ptoas-vmi" ]; then
            PTOAS_WHEEL_SOURCE_DIR="${PTO_SOURCE_DIR}/.work/ptoas-vmi-source"
            python packaging/ptoas-vmi/prepare_source.py \
              --output-dir "${PTOAS_WHEEL_SOURCE_DIR}"
          else
            PTOAS_WHEEL_SOURCE_DIR="${PTO_SOURCE_DIR}"
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            TARGET_ARCH="x86_64"
          else
            TARGET_ARCH="arm64"
          fi
          export _PYTHON_HOST_PLATFORM="$(python "$PTO_SOURCE_DIR/docker/get_macos_wheel_plat_name.py" "$TARGET_ARCH")"
          rm -rf "${PTO_SOURCE_DIR}/build/wheel-dist"
          mkdir -p "${PTO_SOURCE_DIR}/build/wheel-dist"
          # LLVM_BUILD_DIR may point at an LLVM install prefix; CMakeLists.txt
          # derives LLVM_DIR/MLIR_DIR from it (see docs/build_with_installed_llvm.md).
          SKBUILD_BUILD_DIR="${PTO_BUILD_DIR}" LLVM_BUILD_DIR="${LLVM_INSTALL_DIR}" \
            python -m pip wheel "${PTOAS_WHEEL_SOURCE_DIR}" \
              --no-build-isolation --no-deps \
              --wheel-dir "${PTO_SOURCE_DIR}/build/wheel-dist"
          shopt -s nullglob
          built_wheels=("$PTO_SOURCE_DIR"/build/wheel-dist/ptoas*.whl)
          if [ "${#built_wheels[@]}" -gt 0 ]; then
            printf 'Built wheel file: %s\n' "$(basename "${built_wheels[0]}")"
          fi

      - name: Validate wheel payload and launcher contract
        run: |
          python "$PTO_SOURCE_DIR/docker/validate_wheel_payload.py" "$PTO_SOURCE_DIR/build/wheel-dist"

      - name: Repair wheel with delocate
        run: |
          set -euo pipefail
          export PTO_WHEEL_DIST_DIR=$PTO_SOURCE_DIR/build/wheel-dist
          export PTO_WHEELHOUSE=$GITHUB_WORKSPACE/wheelhouse
          mkdir -p "$PTO_WHEELHOUSE"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            REQUIRED_ARCH="x86_64"
          else
            REQUIRED_ARCH="arm64"
          fi
          shopt -s nullglob
          wheels=("$PTO_WHEEL_DIST_DIR"/ptoas*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel in $PTO_WHEEL_DIST_DIR, found ${#wheels[@]}:"
            printf '  %s\n' "${wheels[@]}"
            exit 1
          fi

          echo "Runner label: ${{ steps.runner-meta.outputs.label }}"
          echo "Wheel size:"
          du -sh "${wheels[0]}"
          echo "dist contents:"
          ls -lh "$PTO_WHEEL_DIST_DIR"
          echo "delocate dependency summary:"
          delocate-listdeps "${wheels[0]}" || true

          # Static LLVM/MLIR is embedded in PTOASCompiler. Keep the LLVM
          # install-tree path available only for incidental non-LLVM shared
          # dependencies.
          export DYLD_LIBRARY_PATH="${LLVM_INSTALL_DIR}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          delocate-wheel \
            --require-archs "${REQUIRED_ARCH}" \
            --wheel-dir "$PTO_WHEELHOUSE" \
            "${wheels[0]}" &
          delocate_pid=$!

          (
            sleep 4500
            if kill -0 "$delocate_pid" 2>/dev/null; then
              echo "ERROR: delocate-wheel exceeded 75 minutes, terminating pid ${delocate_pid}"
              kill -TERM "$delocate_pid" 2>/dev/null || true
              sleep 15
              kill -KILL "$delocate_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!

          while kill -0 "$delocate_pid" 2>/dev/null; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] delocate still running (pid=${delocate_pid})"
            ps -o pid=,ppid=,%cpu=,%mem=,etime=,command= -p "$delocate_pid" || true
            du -sh "$PTO_WHEEL_DIST_DIR" "$PTO_WHEELHOUSE" 2>/dev/null || true
            sleep 60
          done

          set +e
          wait "$delocate_pid"
          rc=$?
          set -e

          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true

          if [ "$rc" -ne 0 ]; then
            echo "delocate-wheel failed with rc=${rc}"
            echo "Active Python processes:"
            ps -ax -o pid=,ppid=,%cpu=,%mem=,etime=,command= | grep -E '[d]elocate|[p]ython' || true
            echo "Filesystem usage:"
            df -h .
            echo "dist contents after failure:"
            ls -lh "$PTO_WHEEL_DIST_DIR" || true
            echo "wheelhouse contents after failure:"
            ls -lh "$PTO_WHEELHOUSE" || true
            exit "$rc"
          fi

          echo "wheelhouse contents:"
          ls -lh "$PTO_WHEELHOUSE"

      - name: Test wheel installation
        run: |
          PTO_EXPECT_STATIC_LLVM=1 \
            PTO_TEST_WHEEL_PATH="$GITHUB_WORKSPACE/wheelhouse/ptoas*.whl" \
            bash $PTO_SOURCE_DIR/docker/test_wheel_imports.sh

      - name: Upload wheel artifact
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-wheel-macos-py${{ matrix.python }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

      - name: Collect ptoas binary and dependencies
        if: matrix.python == '3.11'
        run: |
          rm -rf "$GITHUB_WORKSPACE/ptoas-dist"
          cmake --install "${PTO_BUILD_DIR}" \
            --prefix "$GITHUB_WORKSPACE/ptoas-dist" \
            --component PTOAS_Python
          cmake --install "${PTO_BUILD_DIR}" \
            --prefix "$GITHUB_WORKSPACE/ptoas-dist" \
            --component PTOAS_CompilerArchive

      - name: Archive ptoas binary artifact
        if: matrix.python == '3.11'
        run: |
          chmod +x "$GITHUB_WORKSPACE/ptoas-dist/bin/ptoas"
          tar -czf "$GITHUB_WORKSPACE/ptoas-bin-macos-${{ matrix.arch }}.tar.gz" \
            -C "$GITHUB_WORKSPACE/ptoas-dist" .

      - name: Smoke test archived ptoas binary artifact
        if: matrix.python == '3.11'
        shell: bash
        run: |
          TEST_DIR="$RUNNER_TEMP/ptoas-dist-smoke-${{ matrix.arch }}"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR/extracted"
          tar -xzf "$GITHUB_WORKSPACE/ptoas-bin-macos-${{ matrix.arch }}.tar.gz" -C "$TEST_DIR/extracted"

          test -x "$TEST_DIR/extracted/bin/ptoas"
          test -f "$TEST_DIR/extracted/ptoas/_cli.py"
          test -f "$TEST_DIR/extracted/ptoas/mlir/ir.py"
          test -f "$TEST_DIR/extracted/ptodsl/__init__.py"
          test -d "$TEST_DIR/extracted/ptoas/_runtime/share/ptoas/TileOps"
          test -d "$TEST_DIR/extracted/ptoas/_runtime/share/ptoas/SoftOps"
          test "$(cat "$TEST_DIR/extracted/.ptoas-python-version")" = "3.11"
          compgen -G "$TEST_DIR/extracted/ptoas/_core*.so" >/dev/null
          compgen -G "$TEST_DIR/extracted/ptoas/mlir/_mlir_libs/libPTOASCompiler*" >/dev/null
          ! compgen -G "$TEST_DIR/extracted/ptoas/mlir/_mlir_libs/libPTOASPythonCAPI*" >/dev/null

          python "$PTO_SOURCE_DIR/docker/validate_installed_native_dependencies.py" \
            "$TEST_DIR/extracted/ptoas" --expect-static-llvm

          env -u PYTHONPATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            "$TEST_DIR/extracted/bin/ptoas" --version
          env -u PYTHONPATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            "$TEST_DIR/extracted/bin/ptoas" \
            "$PTO_SOURCE_DIR/test/lit/pto/kernel_kind_vector_scf_while_emitc.pto" \
            >/dev/null

      - name: Upload ptoas binary artifact
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-bin-macos-${{ matrix.arch }}
          path: ptoas-bin-macos-${{ matrix.arch }}.tar.gz

  upload_release_assets:
    name: Upload release assets
    if: (github.event_name == 'release' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'ptoas-v'))) || github.event_name == 'schedule'
    needs: build_wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Compute release metadata
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            if [[ "${GITHUB_REF_NAME}" == vmi-v* ]]; then
              echo "RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
            else
              echo "RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
            fi
            {
              echo "RELEASE_BODY<<EOF"
              echo "Published release assets for ${GITHUB_REF_NAME}."
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=nightly" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Nightly Build" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
            {
              echo "RELEASE_BODY<<EOF"
              echo "Automated nightly build."
              echo ""
              echo "- Commit: ${GITHUB_SHA}"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- Date (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ptoas-wheel-macos-*
          path: release-artifacts
          merge-multiple: true

      - name: Download x86_64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ptoas-bin-macos-x86_64
          path: release-artifacts/ptoas-bin-macos-x86_64

      - name: Download aarch64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ptoas-bin-macos-aarch64
          path: release-artifacts/ptoas-bin-macos-aarch64

      - name: Collect packaged ptoas binaries
        run: |
          set -euo pipefail
          mv "release-artifacts/ptoas-bin-macos-x86_64/ptoas-bin-macos-x86_64.tar.gz" \
            "release-artifacts/ptoas-bin-macos-x86_64.tar.gz"
          mv "release-artifacts/ptoas-bin-macos-aarch64/ptoas-bin-macos-aarch64.tar.gz" \
            "release-artifacts/ptoas-bin-macos-aarch64.tar.gz"

      - name: Create nightly build manifest
        if: github.event_name == 'schedule'
        env:
          MANIFEST_PATH: release-artifacts/nightly-manifest-macos.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("release-artifacts")
          assets = sorted(path.name for path in root.iterdir() if path.is_file())
          manifest = {
              "platform": "macos",
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "assets": assets,
          }
          Path(os.environ["MANIFEST_PATH"]).write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          body: ${{ env.RELEASE_BODY }}
          overwrite_files: true
          files: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz

      - name: Upload nightly build manifest
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          body: ${{ env.RELEASE_BODY }}
          overwrite_files: true
          files: release-artifacts/nightly-manifest-macos.json
