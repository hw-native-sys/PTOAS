name: CI

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
  # Nightly A3 board validation (GitHub cron is UTC).
  # 19:00 UTC is 03:00 the next day in Beijing (UTC+8).
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Validation stage (build|run)"
        type: choice
        options: [build, run]
        default: run
      run_mode:
        description: "Run mode passed to generated CMake (sim|npu)"
        type: choice
        options: [npu, sim]
        default: npu
      soc_version:
        description: "Ascend SoC version (e.g. Ascend910B1)"
        type: string
        default: Ascend910
      device_id:
        description: "TaskQueue device selector (`auto` or physical device id)"
        type: string
        # NOTE: Shared A3 hosts now require task-submit queueing to obtain
        # temporary device access. Use `auto` by default so the queue picks an
        # allowed device and exposes it to the validation command.
        default: "auto"
      skip_cases:
        description: "Comma/space separated testcase names to skip (e.g. scatter,mrgsort)"
        type: string
        default: "mix_kernel,vadd_validshape,vadd_validshape_dynamic,print,storefp"
      run_only_cases:
        description: "Comma/space separated testcase names to run (empty = run all)"
        type: string
        default: ""
      pto_isa_repo:
        description: "pto-isa repository URL used by the A3 runner"
        type: string
        default: https://gitcode.com/cann/pto-isa.git
      pto_isa_commit:
        description: "pto-isa ref (commit/tag/branch; empty = repository CI pin)"
        type: string
        # NOTE: Pin a known-good GitCode commit for deterministic runs.
        default: 5649f0522ba9987fd22cbf18923b729b97c5f2ff

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  vmi-source-patch-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate VMI source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/ptoas-vmi/prepare_source.py \
            --output-dir .work/ptoas-vmi-source-check \
            --revision HEAD

  license-header-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR386 license headers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_license_headers.py \
            --repo "${{ github.repository }}" \
            --event-name "${{ github.event_name }}" \
            --pr-number "${{ github.event.pull_request.number || '' }}" \
            --base-sha "${{ github.event.pull_request.base.sha || github.event.before || '' }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --github-token "${GITHUB_TOKEN}"

  build-and-test:
    runs-on: ubuntu-22.04
    env:
      PTOAS_CLANG_MAJOR: "15"
      LLVM_REPO: https://github.com/vpto-dev/llvm-project.git
      LLVM_REF: feature-vpto
      LLVM_BUILD_DIR: ${{ github.workspace }}/llvm-project/llvm/build-assert
      LLVM_DIR: ${{ github.workspace }}/llvm-project/llvm/build-assert
      PTO_BUILD_DIR: ${{ github.workspace }}/build-assert
      PTOAS_VENV: ${{ github.workspace }}/.venv-ptoas-assert
      LLVM_CACHE_FLAVOR: llvm19-assert-shared-mlirpy-hardening-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies and create developer environment
        run: |
          # GitHub-hosted runners may include Microsoft apt sources unrelated to
          # PTOAS; these can intermittently return 403 and break apt-get update.
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli*.list \
            /etc/apt/sources.list.d/azure-cli*.sources \
            /etc/apt/sources.list.d/microsoft-prod*.list \
            /etc/apt/sources.list.d/microsoft-prod*.sources \
            /etc/apt/sources.list.d/packages-microsoft-prod*.list \
            /etc/apt/sources.list.d/packages-microsoft-prod*.sources
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git ninja-build \
            python3 python3-pip python3-venv \
            clang-${PTOAS_CLANG_MAJOR} lld-${PTOAS_CLANG_MAJOR} \
            libedit-dev zlib1g-dev libxml2-dev libzstd-dev
          rm -rf "${PTOAS_VENV}"
          python3 -m venv "${PTOAS_VENV}"
          "${PTOAS_VENV}/bin/python" -m pip install --upgrade pip
          # LLVM/MLIR Python bindings are not yet compatible with pybind11 3.x.
          "${PTOAS_VENV}/bin/pip" install \
            'scikit-build-core>=0.12.2,<2' 'pybind11<3' \
            numpy ml-dtypes

      - name: Define payload paths
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: Some GitHub/GHES versions don't allow using `${{ runner.temp }}` in
          # `jobs.<job>.env`. Use the runtime env var instead.
          tmp_root="${RUNNER_TEMP:-${GITHUB_WORKSPACE}/.tmp}"
          echo "PAYLOAD_DIR=${tmp_root}/ptoas_payload" >> "${GITHUB_ENV}"
          echo "PAYLOAD_TGZ=${tmp_root}/ptoas_payload.tgz" >> "${GITHUB_ENV}"

      - name: Prepare payload dir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PAYLOAD_DIR}" "${PAYLOAD_TGZ}"
          mkdir -p "${PAYLOAD_DIR}/test/samples"
          mkdir -p "${PAYLOAD_DIR}/test/npu_validation/scripts"
          mkdir -p "${PAYLOAD_DIR}/test/npu_validation/templates"

      - name: Resolve clang-${{ env.PTOAS_CLANG_MAJOR }} toolchain
        shell: bash
        run: |
          set -euo pipefail

          clang_c="$(command -v "clang-${PTOAS_CLANG_MAJOR}")"
          clang_cxx="$(command -v "clang++-${PTOAS_CLANG_MAJOR}")"
          echo "PTOAS_CMAKE_C_COMPILER=${clang_c}" >> "${GITHUB_ENV}"
          echo "PTOAS_CMAKE_CXX_COMPILER=${clang_cxx}" >> "${GITHUB_ENV}"
          "${clang_c}" --version | head -n 1
          "${clang_cxx}" --version | head -n 1

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CCACHE_NOHASHDIR=true" >> "${GITHUB_ENV}"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"
          ccache --version

      # Keep one bounded cache on the default branch. PRs can restore this
      # shared cache, but do not create a separate cache for every commit.
      - name: Restore main ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-main-${{ runner.os }}-clang${{ env.PTOAS_CLANG_MAJOR }}-${{ github.sha }}
          restore-keys: |
            ccache-main-${{ runner.os }}-clang${{ env.PTOAS_CLANG_MAJOR }}-

      - name: Initialize ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache --max-size=2G
          ccache --zero-stats

      - name: Resolve LLVM source SHA
        shell: bash
        run: |
          set -euo pipefail
          LLVM_SOURCE_SHA="$(git ls-remote "${LLVM_REPO}" "refs/heads/${LLVM_REF}" | awk '{print $1}')"
          [[ -n "${LLVM_SOURCE_SHA}" ]] || {
            echo "ERROR: failed to resolve ${LLVM_REPO} ${LLVM_REF}" >&2
            exit 1
          }
          echo "LLVM_SOURCE_SHA=${LLVM_SOURCE_SHA}" >> "${GITHUB_ENV}"

      # 先恢复 LLVM build 缓存
      - name: Restore LLVM build cache
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            llvm-project/llvm/build-assert
          key: llvm-${{ runner.os }}-clang${{ env.PTOAS_CLANG_MAJOR }}-${{ env.LLVM_SOURCE_SHA }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Prepare LLVM source (no rebuild)
        run: |
          mkdir -p llvm-project
          cd llvm-project

          # cache 只保存 build 目录，这里补一个最小 git repo 供 cmake/ninja 使用
          if [ ! -d .git ]; then
            git init
            git remote add origin "${LLVM_REPO}"
          fi

          git remote set-url origin "${LLVM_REPO}"
          git fetch --depth 1 origin "${LLVM_SOURCE_SHA}"
          git checkout --force "${LLVM_SOURCE_SHA}"

      - name: Build LLVM/MLIR (only if cache miss)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          cd llvm-project
          cmake -C "${GITHUB_WORKSPACE}/cmake/LinuxHardeningCache.cmake" -G Ninja -S llvm -B "${LLVM_BUILD_DIR}" \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE="${PTOAS_VENV}/bin/python" \
            -DPython_EXECUTABLE="${PTOAS_VENV}/bin/python" \
            -Dpybind11_DIR="$("${PTOAS_VENV}/bin/python" -m pybind11 --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${PTOAS_CMAKE_C_COMPILER}" \
            -DCMAKE_CXX_COMPILER="${PTOAS_CMAKE_CXX_COMPILER}" \
            -DLLVM_TARGETS_TO_BUILD="host"

          ninja -C "${LLVM_BUILD_DIR}"
         

      # LLVM build 完成后立即保存缓存，避免后续测试影响缓存内容
      - name: Save LLVM build cache
        if: >-
          steps.cache-llvm.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          success()
        uses: actions/cache/save@v4
        with:
          path: |
            llvm-project/llvm/build-assert
          key: llvm-${{ runner.os }}-clang${{ env.PTOAS_CLANG_MAJOR }}-${{ env.LLVM_SOURCE_SHA }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Validate strict CMake 4 configure
        shell: bash
        run: |
          set -euo pipefail
          cmake4_venv="${RUNNER_TEMP:-${GITHUB_WORKSPACE}/.tmp}/cmake-4.1.3-venv"
          cmake4_build="${RUNNER_TEMP:-${GITHUB_WORKSPACE}/.tmp}/ptoas-cmake4-strict"
          rm -rf "${cmake4_venv}" "${cmake4_build}"
          python3 -m venv "${cmake4_venv}"
          "${cmake4_venv}/bin/python" -m pip install --upgrade pip
          "${cmake4_venv}/bin/pip" install "cmake==4.1.3" 'pybind11<3' numpy ml-dtypes
          cmake4_bin="${cmake4_venv}/bin/cmake"
          "${cmake4_bin}" --version
          "${cmake4_bin}" -C "${GITHUB_WORKSPACE}/cmake/LinuxHardeningCache.cmake" \
            -G Ninja \
            -S "${GITHUB_WORKSPACE}" \
            -B "${cmake4_build}" \
            -DLLVM_DIR="${LLVM_DIR}/lib/cmake/llvm" \
            -DMLIR_DIR="${LLVM_DIR}/lib/cmake/mlir" \
            -DPython3_EXECUTABLE="${cmake4_venv}/bin/python" \
            -DPython3_FIND_STRATEGY=LOCATION \
            -Dpybind11_DIR="$("${cmake4_venv}/bin/python" -m pybind11 --cmakedir)" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPTO_ENABLE_PYTHON_BINDING=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER="${PTOAS_CMAKE_C_COMPILER}" \
            -DCMAKE_CXX_COMPILER="${PTOAS_CMAKE_CXX_COMPILER}" \
            -Werror=dev

      - name: Install PTOAS editable
        run: |
          set -euo pipefail
          rm -rf "${PTO_BUILD_DIR}"
          # Keep a persistent CMake build tree for CTest and lit while exposing
          # the current sources and Python extension through the developer venv.
          LLVM_BUILD_DIR="${LLVM_DIR}" \
          CC="${PTOAS_CMAKE_C_COMPILER}" \
          CXX="${PTOAS_CMAKE_CXX_COMPILER}" \
            "${PTOAS_VENV}/bin/python" -m pip install --editable . \
              --no-build-isolation --no-deps \
              --config-settings="build-dir=${PTO_BUILD_DIR}"

      - name: Test PTOAS editable install
        shell: bash
        run: |
          set -euo pipefail
          PATH="${PTOAS_VENV}/bin:${PATH}" \
          PYTHON="${PTOAS_VENV}/bin/python" \
            bash docker/test_wheel_imports.sh

      - name: Run PTODSL Python tests
        shell: bash
        env:
          LLVM_DIR: ${{ env.LLVM_DIR }}
        run: |
          export PATH="${PTOAS_VENV}/bin:${LLVM_DIR}/bin:${PATH}"
          ctest --test-dir "${PTO_BUILD_DIR}" --output-on-failure -L PTODSL

      - name: Run PTO-BC tests
        shell: bash
        env:
          LLVM_DIR: ${{ env.LLVM_DIR }}
        run: |
          export PATH="${PTOAS_VENV}/bin:${LLVM_DIR}/bin:${PATH}"
          ctest --test-dir "${PTO_BUILD_DIR}" --output-on-failure -R '^ptobc_'

      - name: Verify PTO-BC v0 against the pre-unification reader
        shell: bash
        env:
          PTOBC_V0_LEGACY_COMMIT: 1960e865ae374db958a63e52dac54c815d5af770
        run: |
          set -euo pipefail
          legacy_root="${RUNNER_TEMP:-${GITHUB_WORKSPACE}/.tmp}/ptoas-v0-legacy"
          legacy_src="${legacy_root}/src"
          legacy_build="${legacy_root}/build"
          rm -rf "${legacy_root}"
          git fetch --no-tags --depth=1 \
            https://github.com/hw-native-sys/PTOAS.git \
            "${PTOBC_V0_LEGACY_COMMIT}"
          git worktree add --detach "${legacy_src}" FETCH_HEAD

          cmake -C "${legacy_src}/cmake/LinuxHardeningCache.cmake" \
            -G Ninja \
            -S "${legacy_src}" \
            -B "${legacy_build}" \
            -DLLVM_DIR="${LLVM_DIR}/lib/cmake/llvm" \
            -DMLIR_DIR="${LLVM_DIR}/lib/cmake/mlir" \
            -DPython3_EXECUTABLE="${PTOAS_VENV}/bin/python" \
            -DPython_EXECUTABLE="${PTOAS_VENV}/bin/python" \
            -DPython3_FIND_STRATEGY=LOCATION \
            -Dpybind11_DIR="$("${PTOAS_VENV}/bin/python" -m pybind11 --cmakedir)" \
            -Dnanobind_DIR="$("${PTOAS_VENV}/bin/python" -m nanobind --cmake_dir)" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPTO_ENABLE_PYTHON_BINDING=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER="${PTOAS_CMAKE_C_COMPILER}" \
            -DCMAKE_CXX_COMPILER="${PTOAS_CMAKE_CXX_COMPILER}"
          cmake --build "${legacy_build}" --target PTOASPythonPackage ptobc

          PTOBC_BIN="${PTO_BUILD_DIR}/tools/ptobc/ptobc" \
          PTOAS_BIN="${PTO_BUILD_DIR}/tools/ptoas/ptoas" \
          PYTHON_EXECUTABLE="${PTOAS_VENV}/bin/python" \
          TESTDATA_DIR="${GITHUB_WORKSPACE}/tools/ptobc/testdata" \
          LEGACY_PTOBC_BIN="${legacy_build}/tools/ptobc/ptobc" \
          LEGACY_PTOAS_BIN="${legacy_build}/tools/ptoas/ptoas" \
          OUT_DIR="${legacy_root}/cross-version-output" \
            bash tools/ptobc/tests/fp_extended_v0_compatibility.sh

      - name: Run lit tests
        shell: bash
        env:
          LLVM_DIR: ${{ env.LLVM_DIR }}
        run: |
          export PATH="${PTOAS_VENV}/bin:${LLVM_DIR}/bin:${PATH}"
          ninja -C "${PTO_BUILD_DIR}" check-pto

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats

      - name: Save main ccache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-main-${{ runner.os }}-clang${{ env.PTOAS_CLANG_MAJOR }}-${{ github.sha }}

      - name: Run sample tests (py -> pto -> cpp)
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SOC_VERSION: ${{ github.event.inputs.soc_version || 'Ascend910' }}
          PTOAS_BIN: ${{ env.PTOAS_VENV }}/bin/ptoas
          PTOBC_BIN: ${{ env.PTO_BUILD_DIR }}/tools/ptobc/ptobc
          PTO_BUILD_DIR: ${{ env.PTO_BUILD_DIR }}
          PYTHON_BIN: ${{ env.PTOAS_VENV }}/bin/python
          PTOAS_SAMPLE_JOBS: "4"
        run: |
          set -euo pipefail
          export PATH="${PTOAS_VENV}/bin:${PATH}"
          export PTOAS_OUT_DIR="${PAYLOAD_DIR}/test/samples"
          if [[ "${CI_EVENT_NAME}" == "workflow_dispatch" || "${CI_EVENT_NAME}" == "schedule" ]]; then
            # Board-validation payloads must only contain the arch-matching
            # direct .pto samples. Some A3/A5 qwen decode cases intentionally
            # share the same testcase basename, so SKIP_CASES cannot
            # distinguish them later once the payload is built.
            SOC_VERSION="${WORKFLOW_SOC_VERSION}" bash test/samples/runop.sh --enablebc all
          else
            bash test/samples/runop.sh --enablebc all
          fi

      - name: Build payload artifact
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'schedule'
          }}
        shell: bash
        run: |
          set -euo pipefail
          cp test/npu_validation/scripts/generate_testcase.py "${PAYLOAD_DIR}/test/npu_validation/scripts/"
          cp test/npu_validation/scripts/run_remote_npu_validation.sh "${PAYLOAD_DIR}/test/npu_validation/scripts/"
          cp test/npu_validation/templates/* "${PAYLOAD_DIR}/test/npu_validation/templates/"
          chmod +x "${PAYLOAD_DIR}/test/npu_validation/scripts/run_remote_npu_validation.sh"
          tar -czf "${PAYLOAD_TGZ}" -C "${PAYLOAD_DIR}" .

      - name: Upload payload artifact
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'schedule'
          }}
        uses: actions/upload-artifact@v4
        with:
          name: ptoas_payload
          path: ${{ env.PAYLOAD_TGZ }}
          if-no-files-found: error

  remote-npu-validation:
    needs: build-and-test
    runs-on: [self-hosted, Linux, ARM64, ptoas-a3]
    timeout-minutes: 480
    concurrency:
      group: a3-nightly-board
      cancel-in-progress: false
    # Ordering: `needs: build-and-test` enforces payload generation before the
    # A3 runner downloads it and submits board work through TaskQueue.
    if: >-
      ${{
        github.repository == 'hw-native-sys/PTOAS' &&
        (github.event_name == 'workflow_dispatch' ||
         github.event_name == 'schedule')
      }}
    env:
      # Temporary CI gate: skip cases that still error/flap on the remote NPU.
      # Update this list as we fix the underlying issues.
      DEFAULT_SKIP_CASES: >-
        mix_kernel,vadd_validshape,vadd_validshape_dynamic,print,storefp
    steps:
      - name: Resolve validation parameters
        shell: bash
        env:
          STAGE: ${{ github.event.inputs.stage || 'run' }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'npu' }}
          SOC_VERSION: ${{ github.event.inputs.soc_version || 'Ascend910' }}
          DEVICE_ID: ${{ github.event.inputs.device_id || 'auto' }}
          SKIP_CASES: ${{ github.event.inputs.skip_cases || '' }}
          RUN_ONLY_CASES: ${{ github.event.inputs.run_only_cases || '' }}
          PTO_ISA_REPO: ${{ github.event.inputs.pto_isa_repo || 'https://gitcode.com/cann/pto-isa.git' }}
          PTO_ISA_COMMIT: ${{ github.event.inputs.pto_isa_commit || '5649f0522ba9987fd22cbf18923b729b97c5f2ff' }}
        run: |
          set -euo pipefail
          # For scheduled runs, default to DEFAULT_SKIP_CASES (known-bad/flaky).
          # For workflow_dispatch runs, honor the user's input (the UI default
          # is pre-filled but can be edited to run everything).
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if [[ -z "${SKIP_CASES}" ]]; then
              SKIP_CASES="${DEFAULT_SKIP_CASES}"
            fi
          fi

          # Some validation samples are arch-specific due to stricter pto-isa
          # static checks and A5-only tile layouts. Always skip the
          # non-matching variant based on SOC_VERSION, even for explicit
          # RUN_ONLY_CASES requests, so remote validation does not try to force
          # A5-only cases through an A3 flow or vice versa.
          A3_ONLY_CASES="partition5d,partition5d_dynamic,mrgsort,tmatmulk_autosync,movfp_fixpipe_reuse_a3"
          A5_ONLY_CASES="partition5d_a5,partition5d_dynamic_a5,mrgsort_a5,tmatmulk_autosync_a5,tpack,matmul_mx_low_precision,gemvmx,movfp_fixpipe_reuse"

          sv_lc="$(printf '%s' "${SOC_VERSION}" | tr '[:upper:]' '[:lower:]')"
          is_a5=0
          if [[ "${sv_lc}" == *"950"* || "${sv_lc}" == *"a5"* ]]; then
            is_a5=1
          fi

          if [[ ${is_a5} -eq 1 ]]; then
            SKIP_CASES="${SKIP_CASES:+${SKIP_CASES},}${A3_ONLY_CASES}"
          else
            SKIP_CASES="${SKIP_CASES:+${SKIP_CASES},}${A5_ONLY_CASES}"
          fi

          echo "STAGE=${STAGE}" >> "${GITHUB_ENV}"
          echo "RUN_MODE=${RUN_MODE}" >> "${GITHUB_ENV}"
          echo "SOC_VERSION=${SOC_VERSION}" >> "${GITHUB_ENV}"
          echo "DEVICE_ID=${DEVICE_ID}" >> "${GITHUB_ENV}"
          echo "SKIP_CASES=${SKIP_CASES}" >> "${GITHUB_ENV}"
          echo "RUN_ONLY_CASES=${RUN_ONLY_CASES}" >> "${GITHUB_ENV}"
          echo "PTO_ISA_REPO=${PTO_ISA_REPO}" >> "${GITHUB_ENV}"
          echo "PTO_ISA_COMMIT=${PTO_ISA_COMMIT}" >> "${GITHUB_ENV}"

      - name: Check A3 runner environment
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(uname -m)" == "aarch64" ]] || {
            echo "ERROR: A3 runner must be aarch64" >&2
            exit 1
          }
          for command in bash cmake git make python3 tar task-submit; do
            command -v "${command}" >/dev/null || {
              echo "ERROR: required command is missing: ${command}" >&2
              exit 1
            }
          done
          python3 - <<'PY'
          import numpy

          print("numpy", numpy.__version__)
          PY

      - name: Prepare isolated work directory
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" ]] || {
            echo "ERROR: RUNNER_TEMP is empty" >&2
            exit 1
          }
          work_root="${RUNNER_TEMP}/ptoas-a3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "${work_root}" in
            "${RUNNER_TEMP}"/ptoas-a3-*) ;;
            *) echo "ERROR: unsafe work root: ${work_root}" >&2; exit 1 ;;
          esac
          rm -rf -- "${work_root}"
          mkdir -p "${work_root}/download" "${work_root}/payload"

          {
            echo "WORK_ROOT=${work_root}"
            echo "PAYLOAD_DOWNLOAD_DIR=${work_root}/download"
            echo "PAYLOAD_TGZ=${work_root}/download/ptoas_payload.tgz"
            echo "PAYLOAD_DIR=${work_root}/payload"
            echo "PTO_ISA_SOURCE_DIR=${work_root}/pto-isa-source"
            echo "OUTPUT_ROOT=${work_root}/npu-validation"
            echo "RESULTS_TSV=${work_root}/remote_npu_validation_results.tsv"
            echo "BOARD_LOG=${work_root}/board-validation.log"
          } >> "${GITHUB_ENV}"

      - name: Download payload artifact
        uses: actions/download-artifact@v4
        with:
          name: ptoas_payload
          path: ${{ env.PAYLOAD_DOWNLOAD_DIR }}

      - name: Extract payload and vendor pto-isa
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "${PAYLOAD_TGZ}" ]] || {
            echo "ERROR: payload tarball not found: ${PAYLOAD_TGZ}" >&2
            exit 1
          }
          tar -xzf "${PAYLOAD_TGZ}" -C "${PAYLOAD_DIR}"

          git clone "${PTO_ISA_REPO}" "${PTO_ISA_SOURCE_DIR}"
          if [[ -n "${PTO_ISA_COMMIT}" ]]; then
            git -C "${PTO_ISA_SOURCE_DIR}" checkout -f "${PTO_ISA_COMMIT}"
          else
            git -C "${PTO_ISA_SOURCE_DIR}" checkout -f origin/HEAD
          fi
          mv "${PTO_ISA_SOURCE_DIR}" "${PAYLOAD_DIR}/pto-isa"
          rm -rf -- "${PAYLOAD_DIR}/pto-isa/.git"
          echo "Vendored pto-isa ${PTO_ISA_COMMIT:-origin/HEAD}"

      - name: Run A3 board validation through TaskQueue
        id: board
        shell: bash
        run: |
          set -euo pipefail
          device_id="${DEVICE_ID:-auto}"
          env_file="${WORK_ROOT}/board-validation.env"
          printf '%s\n' \
            "STAGE=${STAGE}" \
            "RUN_MODE=${RUN_MODE}" \
            "SOC_VERSION=${SOC_VERSION}" \
            "GOLDEN_MODE=npu" \
            "SKIP_CASES=${SKIP_CASES}" \
            "RUN_ONLY_CASES=${RUN_ONLY_CASES}" \
            "EXPECTED_CASES_FILTER=${RUN_ONLY_CASES}" \
            "PTO_ISA_REPO=${PTO_ISA_REPO}" \
            "PTO_ISA_COMMIT=${PTO_ISA_COMMIT}" \
            "OUTPUT_ROOT=${OUTPUT_ROOT}" \
            "RESULTS_TSV=${RESULTS_TSV}" \
            > "${env_file}"

          # shellcheck disable=SC2016 # TASK_DEVICE expands inside TaskQueue.
          printf -v board_command \
            'cd %q && export DEVICE_ID="${TASK_DEVICE:-%s}" && bash ./test/npu_validation/scripts/run_remote_npu_validation.sh' \
            "${PAYLOAD_DIR}" "${device_id}"
          set +e
          submit_output="$(task-submit \
            --device "${device_id}" \
            --max-time 0 \
            --env-file "${env_file}" \
            "${board_command}" 2>&1)"
          submit_rc=$?
          set -e
          printf '%s\n' "${submit_output}" | tee "${BOARD_LOG}"
          if [[ "${submit_rc}" -ne 0 ]]; then
            echo "ERROR: task-submit failed (exit ${submit_rc})" | tee -a "${BOARD_LOG}" >&2
            exit "${submit_rc}"
          fi
          task_id="$(printf '%s\n' "${submit_output}" | awk '
            match($0, /task_[0-9]{8}_[0-9]{6}_[0-9]+/) {
              id = substr($0, RSTART, RLENGTH)
            }
            END { print id }
          ')"
          [[ -n "${task_id}" ]] || {
            echo "ERROR: task-submit did not return a task id" | tee -a "${BOARD_LOG}" >&2
            exit 1
          }

          # shellcheck disable=SC2329 # Invoked by the signal trap below.
          cancel_task() {
            echo "Cancelling TaskQueue task ${task_id}" | tee -a "${BOARD_LOG}"
            task-submit --kill "${task_id}" >/dev/null 2>&1 || true
          }
          trap cancel_task INT TERM

          set +e
          task-submit --timeout 0 --wait "${task_id}" 2>&1 | tee -a "${BOARD_LOG}"
          wait_rc="${PIPESTATUS[0]}"
          set -e
          trap - INT TERM

          set +e
          status_output="$(task-submit --status "${task_id}" 2>&1)"
          status_rc=$?
          set -e
          printf '%s\n' "${status_output}" | tee -a "${BOARD_LOG}"
          if [[ "${status_rc}" -ne 0 ]]; then
            echo "ERROR: task-submit --status failed (exit ${status_rc})" | tee -a "${BOARD_LOG}" >&2
            exit "${status_rc}"
          fi
          if [[ "${status_output}" =~ exit=([0-9]+) ]]; then
            task_rc="${BASH_REMATCH[1]}"
          else
            echo "ERROR: TaskQueue status has no exit code (wait rc=${wait_rc})" | tee -a "${BOARD_LOG}" >&2
            exit 1
          fi
          if [[ "${wait_rc}" -ne "${task_rc}" ]]; then
            echo "WARNING: task wait rc=${wait_rc}, recorded task rc=${task_rc}" | tee -a "${BOARD_LOG}" >&2
          fi
          exit "${task_rc}"

      - name: Upload A3 board artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-nightly-board-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULTS_TSV }}
            ${{ env.BOARD_LOG }}
            ${{ env.PAYLOAD_DIR }}/test/samples/expected_npu_validation_cases.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean isolated work directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORK_ROOT:-}" || -z "${RUNNER_TEMP:-}" ]]; then
            echo "Work directory was not initialized; nothing to clean."
            exit 0
          fi
          case "${WORK_ROOT}" in
            "${RUNNER_TEMP}"/ptoas-a3-*) ;;
            *) echo "ERROR: refusing to clean unsafe path: ${WORK_ROOT}" >&2; exit 1 ;;
          esac

          printf -v cleanup_command 'rm -rf -- %q' "${WORK_ROOT}"
          task-submit --max-time 300 --run "${cleanup_command}" || {
            echo "WARNING: TaskQueue cleanup failed; trying as the runner user" >&2
            rm -rf -- "${WORK_ROOT}"
          }
